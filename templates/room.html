<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARASAN • Game Room</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260826-3">
<link rel="stylesheet" href="/assets/css/style.css?v=20260826-3">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body class="room-page">
<div class="container room-container">
  <header class="room-topbar">
    <div class="room-brand"><span>🎲</span><h1>Game Room</h1></div>
    <a href="/dashboard" class="home-link">Home</a>
  </header>

  <main class="room-card">
    <div class="room-heading-row">
      <div>
        <h2>Room Code: <strong>{{ room_code }}</strong></h2>
        <p>Share this code with friends, or invite accepted friends below.</p>
      </div>
      <div class="player-count" id="playerCount">● Players: 1 / 4</div>
    </div>

    <div class="room-actions">
      <button id="addSystemBtn" class="room-btn purple" type="button" onclick="addSystemPlayers()">👥 Add System Players</button>
      <button id="startBtn" class="room-btn gold" type="button" onclick="startGameNow()">▶ START GAME</button>
    </div>

    <div id="notice" class="room-notice hidden"></div>

    <section class="players-section">
      <div class="section-title"><span>👥</span><h3>Players in this room</h3></div>
      <div class="title-line"></div>
      <div id="players" class="players-list"></div>
    </section>

    <section id="friendInvites" class="friends-section hidden"></section>
  </main>

  <footer class="room-footer">
    <span>🎲 Room Code: {{ room_code }}</span>
    <span id="roomStatus">Waiting for players…</span>
    <span>❔ Need help? Contact your friends.</span>
  </footer>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const room={{ room_code|tojson }};
const host={{ host|tojson }};
const currentUser={{ session.get('username','')|tojson }};
let latestState=null;
let socket=null;

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function showNotice(message,error=true){
  const el=document.getElementById('notice');
  el.textContent=message||'';
  el.classList.toggle('hidden',!message);
  el.classList.toggle('error',!!error);
  if(message && !error) setTimeout(()=>{if(el.textContent===message)el.classList.add('hidden')},2500);
}
function draw(state){
  if(!state || !Array.isArray(state.players)) return;
  latestState=state;
  const players=state.players;
  document.getElementById('playerCount').textContent=`● Players: ${players.length} / 4`;
  document.getElementById('roomStatus').textContent=state.started?'Game started…':'Waiting for players…';
  document.getElementById('startBtn').disabled=state.started;
  document.getElementById('addSystemBtn').disabled=state.started || players.length>=4;
  const box=document.getElementById('players');
  box.innerHTML=players.map((p,i)=>{
    const system=!!p.system;
    const initials=escapeHtml((p.username||'?').trim().slice(0,1).toUpperCase());
    return `<div class="player-row ${system?'system-player':''}">
      <div class="avatar ${system?'bot-avatar':''}">${system?'🤖':initials}</div>
      <div class="player-main"><b>${escapeHtml(p.username)}</b><small>${system?'SYSTEM / BOT':'PLAYER'}${p.username===currentUser?' • YOU':''}</small></div>
      <div class="ready-pill">✓ Ready</div>
      <div class="player-number">${i+1}</div>
    </div>`;
  }).join('');
}

async function refreshRoom(){
  try{
    const res=await fetch(`/api/room/${encodeURIComponent(room)}`,{cache:'no-store'});
    const d=await res.json();
    if(!res.ok){ showNotice(d.error||'Room not found. Please create a new room.'); return; }
    draw(d);
    if(d.started && location.pathname !== `/game/${room}`){ location.href=`/game/${room}`; }
  }catch(e){ showNotice('Connection is temporarily unavailable. Retrying…'); }
}

async function addSystemPlayers(){
  const btn=document.getElementById('addSystemBtn');
  btn.disabled=true;
  try{
    const res=await fetch(`/api/room/${encodeURIComponent(room)}/add-system`,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store'});
    const d=await res.json();
    if(!res.ok) throw new Error(d.error||'Unable to add system players.');
    draw(d); showNotice('System players added. Room is ready.',false);
  }catch(e){
    btn.disabled=false; showNotice(e.message||'Unable to add system players.');
  }
}

async function startGameNow(){
  const btn=document.getElementById('startBtn');
  btn.disabled=true; showNotice('Starting game…',false);
  try{
    const res=await fetch(`/api/room/${encodeURIComponent(room)}/start`,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store'});
    const d=await res.json();
    if(!res.ok) throw new Error(d.error||'Unable to start game.');
    location.href=d.redirect||`/game/${room}`;
  }catch(e){
    btn.disabled=false; showNotice(e.message||'Unable to start game.');
  }
}

async function loadFriends(){
  if(currentUser!==host) return;
  try{
    const res=await fetch('/api/friends',{cache:'no-store'}); const d=await res.json();
    const box=document.getElementById('friendInvites');
    if(!d.friends || !d.friends.length){box.classList.add('hidden');return;}
    box.classList.remove('hidden');
    box.innerHTML='<h3>🤝 Invite Friends</h3>'+d.friends.map(f=>`<button class="friend-chip" onclick="inviteFriend('${escapeHtml(f.username)}')">＋ ${escapeHtml(f.username)}</button>`).join('');
  }catch(e){}
}
function inviteFriend(username){
  if(socket) socket.emit('invite_friend',{room,username});
}

try{
  socket=io({transports:['websocket','polling'],timeout:5000});
  socket.emit('join_room_game',{room});
  socket.on('room_update',draw);
  socket.on('room_notice',d=>showNotice(d.message||'Room update'));
  socket.on('game_started',()=>{location.href=`/game/${room}`});
  socket.on('start_error',d=>{document.getElementById('startBtn').disabled=false;showNotice(d.message||'Unable to start game.')});
}catch(e){}

refreshRoom();
setInterval(refreshRoom,1500);
loadFriends();
</script>
</body>
</html>
