<!doctype html><html><head><title>Game Room</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260826-2"><link rel="stylesheet" href="/assets/css/style.css?v=20260826-2"><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><style id="arasan-critical">
*{box-sizing:border-box}html{min-height:100%;background:#080914}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 15% 5%,#2b1a56 0,transparent 30%),radial-gradient(circle at 90% 15%,#18375b 0,transparent 28%),linear-gradient(145deg,#070812,#11152c 55%,#090a13);color:#f8fafc}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}.container{max-width:1100px;margin:auto;padding:24px}.card,.hero-card{background:linear-gradient(145deg,rgba(24,28,56,.94),rgba(11,14,31,.94));border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;margin:18px 0;box-shadow:0 20px 60px rgba(0,0,0,.22)}h1,h2,h3,p{margin-top:0}a{color:#ffdf7d}button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 19px;margin:8px 4px;border:1px solid transparent;border-radius:13px;background:linear-gradient(135deg,#ffdf7d,#f6c453);color:#17120a;font-weight:900;cursor:pointer;text-decoration:none}input,select{width:100%;padding:14px 15px;margin:8px 0;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:#fff;color:#111;font-size:15px}.auth{max-width:460px;margin:9vh auto;padding:34px}.auth h1{font-size:36px;letter-spacing:2px;color:#fff}.auth form{display:grid;gap:4px}.auth form button{width:100%;margin:8px 0}.error{padding:12px 14px;margin:12px 0;border-radius:12px;background:rgba(255,102,120,.12);border:1px solid #ff6678;color:#ffd4d9}.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}.brand{display:flex;align-items:center;gap:12px}.brand-crown{font-size:38px}.brand h1{font-size:20px;letter-spacing:4px;margin:0}.exit-link{padding:9px 13px;border:1px solid rgba(255,255,255,.12);border-radius:12px;text-decoration:none;color:#fff}.muted{color:#a9b0c7}.hidden{display:none!important}@media(max-width:760px){.container{padding:14px}.card,.hero-card{border-radius:19px;padding:18px;margin:12px 0}.auth{margin:4vh 14px}.auth h1{font-size:30px}}
</style>
</head>
<body><div class="container"><header><h1>🎲 Game Room</h1><a href="/dashboard">Home</a></header>
<div class="card">
<h2>Room Code: <span class="code">{{room_code}}</span></h2>
<p>Share this code with friends, or invite accepted friends below.</p>
<div id="players"></div>
<div id="friendInvites"></div>
<button onclick="addSystem()">Add System Players</button>
<button onclick="startGame()">START GAME</button>
<div id="notice" class="result-box"></div>
</div></div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const room="{{room_code}}", host="{{host}}", currentUser="{{session.get('username','')}}";
const socket=io(); socket.emit("join_room_game",{room});
async function loadFriends(){
  const d=await (await fetch("/api/friends")).json();
  if(currentUser!==host){document.getElementById("friendInvites").innerHTML="";return;}
  document.getElementById("friendInvites").innerHTML=`<h3>🤝 Invite Friends</h3>`+
    (d.friends.length?d.friends.map(f=>`<button class="friend-chip" onclick="inviteFriend('${escapeAttr(f.username)}')">＋ ${escapeHtml(f.username)}</button>`).join(""):
    "<small>Accept friends on Home first.</small>");
}
function draw(d){
 document.getElementById("players").innerHTML="<h3>Players in room</h3>"+d.players.map((p,i)=>`<div class="player"><b>${i+1}. ${escapeHtml(p.username)}</b> ${p.system?"🤖 System":"👤 Player"}</div>`).join("");
}
function inviteFriend(username){socket.emit("invite_friend",{room,username});}
function addSystem(){socket.emit("add_system",{room})}
function startGame(){socket.emit("start_game",{room})}
socket.on("room_update",draw);
socket.on("room_notice",d=>document.getElementById("notice").textContent=d.message);
socket.on("game_started",()=>location.href="/game/"+room);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#96;");}
loadFriends();
</script></body></html>
