<!doctype html><html><head><title>Create Account</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"></head>
<body><div class="auth card"><h1>👑 Create Account</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}
